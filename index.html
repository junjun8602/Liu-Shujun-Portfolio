<style>
@font-face{font-family:"PP Neue Montreal";src:url("./assets/fonts/PPNeueMontreal-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--bg:#0d0c0b;--ink:#e8e4dc;--gold:#FFD34D;--dim:rgba(232,228,220,.38)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"PP Neue Montreal",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{text-align:center}
.disc{width:74px;height:74px;margin:0 auto 30px;border-radius:50%;position:relative;
  background:radial-gradient(circle at center,#1a1917 0 18%,#242220 18% 20%,#1a1917 20% 34%,#242220 34% 35%,#1a1917 35% 100%);
  box-shadow:0 0 0 1px rgba(232,228,220,.12),0 8px 32px rgba(0,0,0,.5);
  animation:spin 3.6s linear infinite,fadein 1.4s ease both}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 40%,rgba(255,211,77,.5) 62%,transparent 84% 100%);
  mix-blend-mode:screen;animation:spin 3.6s linear infinite}
.disc::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(255,211,77,.85);z-index:2;animation:pulse 2.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.name{font-size:27px;letter-spacing:.42em;margin-left:.42em;color:var(--ink);animation:rise 1.5s cubic-bezier(.2,.7,.3,1) .15s both}
.sub{margin-top:13px;font-size:11px;letter-spacing:.5em;margin-left:.5em;color:var(--dim);animation:rise 1.5s cubic-bezier(.2,.7,.3,1) .35s both}
.bar{width:150px;height:1px;margin:32px auto 0;background:rgba(232,228,220,.15);position:relative;overflow:hidden;animation:fadein 1.2s ease .55s both}
.bar::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:sweep 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sweep{to{left:100%}}
.fallback{margin-top:36px;font-size:12px;color:var(--dim);opacity:0;animation:fadein 1s ease 5s both}
.fallback a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(255,211,77,.7);padding-bottom:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="disc"></div>
  <div class="name">刘书君</div>
  <div class="sub">LIU SHUJUN · PORTFOLIO</div>
  <div class="bar"></div>

</div>

</body>
